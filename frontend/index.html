<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>


    <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet">


    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="container mt-5">


    <h1 class="text-center mb-4">
        Expense Tracker
    </h1>



    <!-- Add / Update Form -->

    <div class="card p-4 mb-5">


        <h2 id="formTitle">
            Add Expense
        </h2>



        <div class="row mt-3">


            <div class="col-md-3">

                <input 
                class="form-control"
                id="title"
                placeholder="Title">

            </div>



            <div class="col-md-2">

                <input 
                class="form-control"
                id="amount"
                placeholder="Amount"
                type="number">

            </div>



            <div class="col-md-3">

                <input 
                class="form-control"
                id="category"
                placeholder="Category">

            </div>



            <div class="col-md-3">

                <input 
                class="form-control"
                id="date"
                type="date">

            </div>



            <div class="col-md-1">

                <button 
                class="btn btn-primary w-100"
                id="saveButton"
                onclick="saveExpense()">

                    Add

                </button>

            </div>



        </div>


    </div>





    <!-- Expenses Table -->


    <table class="table table-bordered table-striped">


        <thead class="table-dark">


            <tr>


                <th>
                    ID
                </th>


                <th>
                    Title
                </th>


                <th>
                    Amount
                </th>


                <th>
                    Category
                </th>


                <th>
                    Date
                </th>


                <th>
                    Action
                </th>


            </tr>


        </thead>



        <tbody id="expenseTable">


        </tbody>



    </table>



</div>





<script src="js/app.js"></script>



</body>


</html>
